unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ── True color ──────────────────────────────────────────────
# (macOS: if tmux complains about tmux-256color, `brew install ncurses`
#  or swap this line for "xterm-256color")
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
 
# ── Nice touches ────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"   # window name = folder
 
# ── Status bar ──────────────────────────────────────────────
set -g status-position top
set -g status 2                       # two status lines...
set -g status-format[1] ""            # ...the second one blank, as a spacer above your panes
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#7f7c7b"                 # transparent, shows your wallpaper
 
# Session pill: blue normally, pink while the prefix is held
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#e8bacf],#[bg=#00a0e4]}#[fg=#090200,bold] #S #[default] "
 
# Windows: same look as kitty's tabs (#494542 / #eeeeee), "+" when zoomed
set -g window-status-separator ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#494542,fg=#eeeeee,bold] #I #W#{?window_zoomed_flag, +,} "
set -g window-status-activity-style "fg=#fcec02"            # output changed (agent working)
set -g window-status-bell-style "fg=#da2c20,bold"           # bell (agent needs you)
 
# Right side: running command · date · time
set -g status-right-length 60
set -g status-right "#[fg=#7f7c7b]#{pane_current_command}  #[fg=#b5e4f4]%a %b %d  #[fg=#eeeeee,bold]%H:%M "
 
# ── Panes ───────────────────────────────────────────────────
set -g pane-border-lines single
set -g pane-border-style "fg=#3a3332"
set -g pane-active-border-style "fg=#a4a1a1"
set -g display-panes-colour "#494542"
set -g display-panes-active-colour "#00a0e4"
 
# ── Messages, copy mode, popups, clock ──────────────────────
set -g message-style "bg=#494542,fg=#eeeeee"
set -g message-command-style "bg=#494542,fg=#eeeeee"
set -g mode-style "bg=#494542,fg=#fcec02"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#a4a1a1"
set -g clock-mode-colour "#00a0e4"

